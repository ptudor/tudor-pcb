name: GerberMetal

options:
  bundleIdPrefix: net.ptudor
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  GerberKit:
    path: GerberKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    LOCALIZED_STRING_SWIFTUI_SUPPORT: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "55QT38683G"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_CFBundleDisplayName: "Gerber Metal"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  GerberMetalMac:
    type: application
    platform: macOS
    sources:
      - path: GerberMetal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ptudor.gerbermetal
        PRODUCT_NAME: "Gerber Metal"
        PRODUCT_MODULE_NAME: GerberMetal
        CODE_SIGN_ENTITLEMENTS: GerberMetal/GerberMetal-macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: GerberKit
    scheme:
      testTargets:
        - GerberMetalTests

  GerberMetal:
    type: application
    platform: iOS
    sources:
      - path: GerberMetal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ptudor.gerbermetal
        PRODUCT_NAME: "Gerber Metal"
        PRODUCT_MODULE_NAME: GerberMetal
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: GerberKit

  GerberMetalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GerberMetalTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ptudor.gerbermetal.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    dependencies:
      - target: GerberMetalMac

